#cloud-config

packages:
  - docker.io
  - docker-compose
  - curl
  - jq

runcmd:
  - usermod -aG docker ubuntu
  - systemctl enable docker

  # Установка Docker Compose
  - curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
  - chmod +x /usr/local/bin/docker-compose

  # Создание директории
  - mkdir -p /home/ubuntu/app
  - chown -R ubuntu:ubuntu /home/ubuntu/app

  # Запись docker-compose.yml
  - |
    cat > /home/ubuntu/app/docker-compose.yml << 'EOF'
    version: '3.8'
    services:
      web:
        image: cr.yandex/${registry_id}/web-app:latest
        container_name: web-app
        ports:
          - "80:80"
        environment:
          - DB_HOST=${db_host}
          - DB_USER=${db_user}
          - DB_NAME=${db_name}
        restart: unless-stopped
    EOF

  # Подстановка переменных
  - sed -i "s|\${registry_id}|${registry_id}|g" /home/ubuntu/app/docker-compose.yml
  - sed -i "s|\${db_host}|${db_host}|g" /home/ubuntu/app/docker-compose.yml
  - sed -i "s|\${db_user}|${db_user}|g" /home/ubuntu/app/docker-compose.yml
  - sed -i "s|\${db_name}|${db_name}|g" /home/ubuntu/app/docker-compose.yml

  # Авторизация в Container Registry
  - sudo -u ubuntu bash -c 'yc container registry configure-docker --registry-id ${registry_id}'

  # Запуск приложения
  - cd /home/ubuntu/app && docker-compose up -d

  # Перезапуск Docker (на всякий случай)
  - systemctl restart docker
