#cloud-config

packages:
  - docker.io
  - docker-compose
  - curl
  - jq

runcmd:
  # Установка Yandex Cloud CLI
  - curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
  - source /home/ubuntu/.bashrc

  # Настройка yc через IAM-токен
  - yc config set token ${iam_token}
  - yc config set cloud-id ${cloud_id}
  - yc config set folder-id ${folder_id}
  - yc config set compute-default-zone ru-central1-a

  # Авторизация в Container Registry
  - yc container registry configure-docker cr.yandex/${registry_id}

  # Создание директории
  - mkdir -p /home/ubuntu/app
  - chown -R ubuntu:ubuntu /home/ubuntu/app

  # Запись docker-compose.yml
  - |
    cat > /home/ubuntu/app/docker-compose.yml << 'EOF'
    version: '3.8'
    services:
      web:
        image: cr.yandex/${registry_id}/web-app:latest
        container_name: web-app
        ports:
          - "80:80"
        environment:
          - DB_HOST=${db_host}
          - DB_USER=${db_user}
          - DB_NAME=${db_name}
        restart: unless-stopped
    EOF

  # Подстановка переменных
  - sed -i "s|\${registry_id}|${registry_id}|g" /home/ubuntu/app/docker-compose.yml
  - sed -i "s|\${db_host}|${db_host}|g" /home/ubuntu/app/docker-compose.yml
  - sed -i "s|\${db_user}|${db_user}|g" /home/ubuntu/app/docker-compose.yml
  - sed -i "s|\${db_name}|${db_name}|g" /home/ubuntu/app/docker-compose.yml

  # Проверка и запуск
  - cd /home/ubuntu/app && docker-compose up -d

  # Перезапуск Docker
  - systemctl restart docker